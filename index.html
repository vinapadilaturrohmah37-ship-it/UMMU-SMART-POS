

<div id="loginPage" class="login-container">
    <div class="login-box">
        <h2>UMMU SMART POS</h2>
        <p>Silakan login untuk masuk</p>

        <form id="loginForm">
            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">LOGIN</button>
        </form>
    </div>
</div>
<div id="dashboardPage" style="display:none;">
    <h2>Dashboard UMMU SMART POS</h2>

    <button onclick="showMenu('produk')">Produk</button>
    <button onclick="showMenu('transaksi')">Transaksi</button>
    <button onclick="showMenu('laporan')">Laporan</button>
    <button onclick="logout()">Logout</button>

    <div id="totalPenjualan"></div>
    <div id="totalTransaksi"></div>
    <div id="jumlahProduk"></div>

    <div id="contentArea"></div>
</div>
