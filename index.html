

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMMU SMART POS</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HALAMAN LOGIN -->
    <div id="loginPage" class="login-container">

        <div class="login-box">

            <div class="logo">
                <h1>UMMU</h1>
                <p>SMART POS</p>
            </div>

            <h2>Selamat Datang!</h2>
            <p>Silakan login untuk masuk ke aplikasi kasir.</p>

            <form id="loginForm">

                <input
                    type="text"
                    id="username"
                    placeholder="Masukkan Username"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Masukkan Password"
                    required
                >

                <button type="submit">LOGIN</button>

            </form>

            <p class="footer-login">
                UMMU SMART POS © 2026
            </p>

        </div>

    </div>


    <!-- HALAMAN DASHBOARD -->
    <div id="dashboardPage" class="dashboard" style="display:none;">

        <header>
            <div>
                <h2>UMMU SMART POS</h2>
                <p>Sistem Kasir Pintar</p>
            </div>

            <button onclick="logout()">LOGOUT</button>
        </header>


        <!-- KARTU INFORMASI -->
        <div class="cards">

            <div class="card">
                <h3>Total Penjualan</h3>
                <p id="totalPenjualan">Rp 0</p>
            </div>

            <div class="card">
                <h3>Total Transaksi</h3>
                <p id="totalTransaksi">0</p>
            </div>

            <div class="card">
                <h3>Jumlah Produk</h3>
                <p id="jumlahProduk">0</p>
            </div>

        </div>


        <!-- MENU -->
        <div class="menu">

            <button onclick="showMenu('produk')">
                DATA PRODUK
            </button>

            <button onclick="showMenu('transaksi')">
                TRANSAKSI
            </button>

            <button onclick="showMenu('laporan')">
                LAPORAN
            </button>

        </div>


        <!-- AREA KONTEN -->
        <div id="contentArea">

            <h3>Selamat Datang di UMMU SMART POS!</h3>

            <p>
                Silakan pilih menu untuk mulai menggunakan aplikasi.
            </p>

        </div>

    </div>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
