
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMMU SMART POS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section id="loginPage" class="login-container">
        <div class="login-box">
            <h1>UMMU</h1>
            <p class="subtitle">SMART POS</p>
            <h2>Selamat Datang!</h2>
            <p>Silakan login untuk masuk aplikasi kasir.</p>

            <form id="loginForm">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">LOGIN</button>
            </form>
            <p class="hint">Demo: admin / 12345</p>
        </div>
    </section>

    <section id="dashboardPage" class="dashboard" style="display:none;">
        <header>
            <div>
                <h2>UMMU SMART POS</h2>
                <p>Sistem Kasir Pintar</p>
            </div>
            <button class="logout" onclick="logout()">Logout</button>
        </header>

        <h2 class="welcome">Dashboard</h2>

        <div class="cards">
            <div class="card">
                <h3>Total Penjualan</h3>
                <p id="totalPenjualan">Rp 0</p>
            </div>
            <div class="card">
                <h3>Total Transaksi</h3>
                <p id="totalTransaksi">0</p>
            </div>
            <div class="card">
                <h3>Jumlah Produk</h3>
                <p id="jumlahProduk">0</p>
            </div>
        </div>

        <nav class="menu">
            <button onclick="showMenu('produk')">Data Produk</button>
            <button onclick="showMenu('transaksi')">Transaksi</button>
            <button onclick="showMenu('laporan')">Laporan</button>
        </nav>

        <main id="contentArea">
            <h3>Selamat datang di UMMU SMART POS!</h3>
            <p>Silakan pilih menu untuk memulai.</p>
        </main>
    </section>

    <script src="script.js"></script>
</body>
</html>
